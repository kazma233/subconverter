services:
  subconv:
    build: .
    image: subconv:latest
    # 镜像仅由本地构建产生，registry 上不存在；禁止 compose 在镜像缺失时尝试拉取
    pull_policy: build
    container_name: subconv
    restart: unless-stopped
    # host 网络模式：容器直接使用宿主机网络栈，无端口映射开销
    # （macOS/Windows Docker Desktop 上 host 模式仅容器内互通，实际部署用 Linux）
    network_mode: host
    environment:
      # production 模式日志写入 LOG_FILE，默认路径即命名卷挂载点，无需配置
      - SUBCONV_ENV=production
      # 服务监听端口，默认 25600（host 网络模式下即宿主机监听端口）
      # - PORT=25600
    volumes:
      # 日志写入 Docker 命名卷，存储位置由 Docker 管理，不绑定宿主机目录
      - subconv-logs:/var/log/subconv

volumes:
  subconv-logs:
